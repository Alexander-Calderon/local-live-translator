name: Validar código y ejecución portable
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3 av==18.1.0
      - run: python -m compileall -q bin install.py
      - run: python -m unittest discover -s tests -v
      - name: Comprobar archivos publicables
        run: python bin/check_publication.py --tracked-only
  portable-replay:
    name: CPU replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Preparar capturador macOS sin grabar audio
        if: runner.os == 'macOS'
        run: python bin/install_capture.py
      - name: Reconocimiento, traducción, controles y cierre con muestra pública
        run: python bin/check_portable_pipeline.py --prepare
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: portable-result-${{ matrix.os }}
          path: .runtime/portability/result.json
          if-no-files-found: ignore
