name: Validar código
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3
      - run: python -m compileall -q bin
      - run: python -m unittest discover -s tests -v
      - name: Comprobar archivos publicables
        run: python bin/check_publication.py --tracked-only
  portable-core:
    name: Core logic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3
      - run: python -m compileall -q bin
      - name: Vocabulary and translation package safety
        run: python -m unittest discover -s tests -p test_translator.py -v
